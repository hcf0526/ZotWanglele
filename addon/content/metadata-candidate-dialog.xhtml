<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/paper-theme.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/metadata-dialog.css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="选择 Crossref 记录"
  windowtype="zotwanglele:metadata-candidate-dialog"
  width="900"
  height="700"
  persist="screenX screenY width height"
  onload="
    window.opener.Zotero.__addonInstance__.hooks.onMetadataCandidateDialogLoad(
      window,
    )
  "
  ondialogcancel="window.zwlMetadataCandidateCancel()"
>
  <vbox flex="1" class="zwl-dialog-root">
    <html:div class="zwl-candidate-shell">
      <html:header class="zwl-dialog-header">
        <html:img
          class="zwl-dialog-brand-mark"
          src="chrome://zotwanglele/content/icons/icon@32.png"
          alt=""
        />
        <html:div class="zwl-dialog-heading-copy">
          <html:h1
            id="zwl-metadata-candidate-title"
            class="zwl-candidate-heading"
            >选择 Crossref 记录</html:h1
          >
          <html:p class="zwl-candidate-note"
            >当前条目没有
            DOI。请选择最匹配的记录，之后仍可逐项选择需要写入的字段。</html:p
          >
        </html:div>
      </html:header>
      <html:div
        id="zwl-metadata-candidate-list"
        class="zwl-candidate-list"
      ></html:div>
      <html:div class="zwl-candidate-toolbar">
        <button
          class="zwl-dialog-button"
          label="取消"
          oncommand="window.zwlMetadataCandidateCancel()"
        />
        <button
          class="zwl-dialog-button zwl-dialog-button-primary"
          label="使用所选记录"
          default="true"
          oncommand="window.zwlMetadataCandidateApply()"
        />
      </html:div>
    </html:div>
  </vbox>
</window>
