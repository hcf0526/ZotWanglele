<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/paper-theme.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/profile-editor.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/model-picker.css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="ZotWanglele - 配置编辑"
  windowtype="zotwanglele:profile-editor"
  width="720"
  height="740"
  persist="screenX screenY width height"
  onload="
    ChromeUtils.importESModule(
      'chrome://zotero/content/zotero.mjs',
    ).Zotero.__addonInstance__.hooks.onProfileEditorLoad(window)
  "
>
  <linkset>
    <html:link rel="localization" href="__addonRef__-profile-editor.ftl" />
    <html:link rel="localization" href="__addonRef__-model-picker.ftl" />
  </linkset>

  <vbox class="zwl-profile-editor-shell" flex="1">
    <hbox align="center" class="zwl-profile-editor-header">
      <html:img
        class="zwl-profile-editor-mark"
        src="chrome://zotwanglele/content/icons/icon@32.png"
        alt=""
      />
      <vbox class="zwl-profile-editor-heading" flex="1">
        <html:h2 data-l10n-id="editor-title" />
        <html:p data-l10n-id="editor-subtitle" />
      </vbox>
    </hbox>

    <html:div class="zwl-profile-editor-section-heading">
      <html:span class="zwl-profile-editor-section-icon" aria-hidden="true"
        >✦</html:span
      >
      <html:span data-l10n-id="editor-section-connection" />
    </html:div>

    <vbox class="zwl-profile-editor-fields">
      <hbox align="center" class="zwl-editor-field">
        <html:label
          for="zwl-editor-supplier"
          data-l10n-id="editor-field-supplier"
        />
        <html:input type="text" id="zwl-editor-supplier" />
      </hbox>
    </vbox>

    <html:div class="zwl-key-heading">
      <html:strong data-l10n-id="editor-keys-heading" />
      <html:button
        type="button"
        id="zwl-editor-add-key"
        data-l10n-id="editor-add-key"
      />
    </html:div>
    <html:div id="zwl-editor-keys" />
    <html:div
      class="zwl-profile-editor-section-heading zwl-profile-editor-section-heading-spaced"
    >
      <html:span class="zwl-profile-editor-section-icon" aria-hidden="true"
        >◌</html:span
      >
      <html:span data-l10n-id="editor-section-generation" />
    </html:div>

    <vbox class="zwl-profile-editor-options">
      <hbox align="center" class="zwl-editor-field">
        <html:label
          for="zwl-editor-temperature"
          data-l10n-id="editor-field-temperature"
        />
        <html:input
          type="range"
          id="zwl-editor-temperature"
          min="0"
          max="100"
        />
        <html:span id="zwl-editor-temperature-value">0.7</html:span>
      </hbox>

      <hbox align="center" class="zwl-editor-field">
        <html:label
          for="zwl-editor-maxTokens"
          data-l10n-id="editor-field-maxtokens"
        />
        <html:input
          type="number"
          id="zwl-editor-maxTokens"
          min="256"
          max="128000"
        />
      </hbox>
    </vbox>

    <hbox align="center" class="zwl-profile-editor-footer">
      <html:span id="zwl-editor-test-status" class="zwl-editor-test-status" />
      <spacer flex="1" />
      <button
        id="zwl-editor-cancel"
        class="zwl-editor-button"
        data-l10n-id="editor-btn-cancel"
        oncommand="window.close()"
      />
      <button
        id="zwl-editor-save"
        class="zwl-editor-button zwl-editor-button-primary"
        data-l10n-id="editor-btn-save"
        oncommand="window.zwlEditorSave()"
      />
    </hbox>
  </vbox>

  <vbox flex="1" id="zwl-model-picker-shell-root" hidden="true">
    <html:div class="zwl-model-picker-shell">
      <html:div class="zwl-dialog-header">
        <html:img
          class="zwl-dialog-brand-mark"
          src="chrome://zotwanglele/content/icons/icon@32.png"
          alt=""
        />
        <html:div class="zwl-dialog-heading-copy">
          <html:h1
            class="zwl-model-picker-title"
            data-l10n-id="model-picker-title"
          >
            选择模型
          </html:h1>
          <html:p
            class="zwl-model-picker-subtitle"
            data-l10n-id="model-picker-subtitle"
          >
            选择需要添加到当前 API Key 的模型
          </html:p>
        </html:div>
      </html:div>

      <html:div class="zwl-model-picker-groups">
        <html:div class="zwl-model-picker-group">
          <html:div class="zwl-model-picker-group-heading">
            <html:strong data-l10n-id="model-picker-available">
              未添加模型
            </html:strong>
            <html:span class="zwl-model-picker-group-mark" aria-hidden="true"
              >＋</html:span
            >
          </html:div>
          <html:div
            id="zwl-model-picker-available"
            class="zwl-model-picker-list"
          ></html:div>
          <html:p
            id="zwl-model-picker-available-empty"
            class="zwl-model-picker-empty"
            data-l10n-id="model-picker-empty-available"
          >
            暂无未添加模型
          </html:p>
        </html:div>

        <html:div
          class="zwl-model-picker-group zwl-model-picker-group-existing"
        >
          <html:div class="zwl-model-picker-group-heading">
            <html:strong data-l10n-id="model-picker-existing">
              已添加模型
            </html:strong>
            <html:span
              class="zwl-model-picker-group-mark zwl-model-picker-group-mark-existing"
              aria-hidden="true"
              >✓</html:span
            >
          </html:div>
          <html:div
            id="zwl-model-picker-existing"
            class="zwl-model-picker-list"
          ></html:div>
          <html:p
            id="zwl-model-picker-existing-empty"
            class="zwl-model-picker-empty"
            data-l10n-id="model-picker-empty-existing"
          >
            暂无已添加模型
          </html:p>
        </html:div>
      </html:div>

      <html:div class="zwl-model-picker-footer">
        <html:p class="zwl-model-picker-hint" data-l10n-id="model-picker-hint">
          已添加模型默认保持选中，确认后将按当前选择更新列表
        </html:p>
        <html:div class="zwl-model-picker-actions">
          <button
            id="zwl-model-picker-cancel"
            class="zwl-dialog-button"
            data-l10n-id="model-picker-cancel"
            label="取消"
            oncommand="window.zwlModelPickerCancel()"
          />
          <button
            id="zwl-model-picker-apply"
            class="zwl-dialog-button zwl-dialog-button-brand"
            data-l10n-id="model-picker-apply"
            label="应用选择"
            default="true"
            oncommand="window.zwlModelPickerApply()"
          />
        </html:div>
      </html:div>
    </html:div>
  </vbox>
</window>
