<?xml-stylesheet href="chrome://global/skin/global.css"?>
<?xml-stylesheet href="chrome://zotwanglele/content/paper-theme.css"?>
<?xml-stylesheet href="chrome://zotwanglele/content/preferences.css"?>
<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  class="zwl-prefs-root"
  flex="1"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <hbox align="center" class="zwl-prefs-header">
    <hbox align="center" class="zwl-prefs-brand" flex="1">
      <html:img
        class="zwl-prefs-brand-mark"
        src="chrome://zotwanglele/content/icons/icon@32.png"
        alt=""
      />
      <vbox class="zwl-prefs-brand-copy" flex="1">
        <html:h2 data-l10n-id="pref-title" />
      </vbox>
    </hbox>
    <button
      id="zotero-prefpane-__addonRef__-open-dashboard"
      class="zwl-prefs-dashboard-button"
      data-l10n-id="pref-open-dashboard"
    />
  </hbox>

  <html:div class="zwl-prefs-section-heading">
    <html:img
      class="zwl-prefs-section-icon"
      src="chrome://zotwanglele/content/icons/preferences/profiles.svg"
      alt=""
    />
    <html:div>
      <html:h3 data-l10n-id="pref-ai-profiles-title" />
      <html:p data-l10n-id="pref-ai-profiles-hint" />
    </html:div>
  </html:div>

  <vbox class="zwl-prefs-profile-area">
    <richlistbox
      id="zotero-prefpane-__addonRef__-profile-list"
      class="zwl-prefs-profile-list"
    />
    <hbox align="center" class="zwl-prefs-actions">
      <button
        id="zotero-prefpane-__addonRef__-profile-use"
        class="zwl-prefs-button zwl-prefs-button-primary"
        data-l10n-id="pref-ai-profile-use"
      />
      <button
        id="zotero-prefpane-__addonRef__-profile-add"
        class="zwl-prefs-button"
        data-l10n-id="pref-ai-profile-add"
      />
      <button
        id="zotero-prefpane-__addonRef__-profile-edit"
        class="zwl-prefs-button"
        data-l10n-id="pref-ai-profile-edit"
      />
      <button
        id="zotero-prefpane-__addonRef__-profile-delete"
        class="zwl-prefs-button zwl-prefs-button-danger"
        data-l10n-id="pref-ai-profile-delete"
      />
      <spacer flex="1" class="zwl-prefs-actions-spring" />
      <button
        id="zotero-prefpane-__addonRef__-profile-up"
        class="zwl-prefs-button"
        data-l10n-id="pref-ai-profile-up"
      />
      <button
        id="zotero-prefpane-__addonRef__-profile-down"
        class="zwl-prefs-button"
        data-l10n-id="pref-ai-profile-down"
      />
    </hbox>
  </vbox>
</groupbox>
