<?xml-stylesheet href="chrome://global/skin/global.css"?>
<?xml-stylesheet href="chrome://zotwanglele/content/paper-theme.css"?>
<?xml-stylesheet href="chrome://zotwanglele/content/preferences.css"?>
<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  class="zwl-prefs-root"
  flex="1"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <hbox align="center" class="zwl-prefs-header">
    <hbox align="center" class="zwl-prefs-brand" flex="1">
      <html:img
        class="zwl-prefs-brand-mark"
        src="chrome://zotwanglele/content/icons/icon@32.png"
        alt=""
      />
      <vbox class="zwl-prefs-brand-copy" flex="1">
        <html:h2 data-l10n-id="pref-title" />
      </vbox>
    </hbox>
    <button
      id="zotero-prefpane-__addonRef__-open-dashboard"
      class="zwl-prefs-dashboard-button"
      data-l10n-id="pref-open-dashboard"
    />
  </hbox>

  <html:div id="zwl-prefs-ai-root" />
</groupbox>
