<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/dashboard.css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="ZotWanglele 仪表盘"
  windowtype="zotwanglele:dashboard"
  width="980"
  height="720"
  persist="screenX screenY width height"
  onload="window.opener.Zotero.__addonInstance__.hooks.onDashboardLoad(window)"
  onunload="
    window.opener.Zotero.__addonInstance__.hooks.onDashboardUnload(window)
  "
>
  <linkset>
    <html:link rel="localization" href="__addonRef__-dashboard.ftl" />
  </linkset>

  <vbox flex="1" style="padding: 12px">
    <!-- 顶部标题栏 -->
    <hbox align="center" style="padding-bottom: 8px">
      <html:h2 data-l10n-id="dashboard-title" style="margin: 0; flex: 1" />
    </hbox>

    <!-- Tab 容器 -->
    <tabbox flex="1">
      <tabs>
        <tab data-l10n-id="dashboard-tab-overview" />
        <tab data-l10n-id="dashboard-tab-queue" />
        <tab data-l10n-id="dashboard-tab-prompts" />
        <tab data-l10n-id="dashboard-tab-advanced" />
      </tabs>
      <tabpanels flex="1">
        <!-- 概览 -->
        <tabpanel
          id="zotwanglele-dashboard-overview"
          orient="vertical"
          flex="1"
        >
          <html:div id="zotwanglele-overview-root" class="zwl-overview">
            <html:h3 data-l10n-id="dashboard-overview-heading" />
            <html:div class="zwl-metrics">
              <html:div class="zwl-metric">
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-profile"
                />
                <html:strong id="zwl-overview-profile">尚未选择</html:strong>
                <html:small id="zwl-overview-model"></html:small>
              </html:div>
              <html:div class="zwl-metric">
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-prompts"
                />
                <html:strong id="zwl-overview-prompts">0</html:strong>
                <html:small id="zwl-overview-custom-prompts"></html:small>
              </html:div>
              <html:div class="zwl-metric">
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-tasks"
                />
                <html:strong id="zwl-overview-tasks">0</html:strong>
                <html:small id="zwl-overview-task-total"></html:small>
              </html:div>
              <html:div class="zwl-metric">
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-titles"
                />
                <html:strong id="zwl-overview-titles">0/0</html:strong>
                <html:small id="zwl-overview-title-caption"></html:small>
              </html:div>
            </html:div>
            <html:div class="zwl-workflows">
              <html:div class="zwl-workflow">
                <html:h4 data-l10n-id="dashboard-overview-review" />
                <html:button
                  id="zwl-overview-review"
                  type="button"
                  data-l10n-id="dashboard-overview-review-action"
                />
              </html:div>
              <html:div class="zwl-workflow">
                <html:h4 data-l10n-id="dashboard-overview-title-translate" />
                <html:button
                  id="zwl-overview-title-translate"
                  type="button"
                  data-l10n-id="dashboard-overview-title-translate-action"
                />
              </html:div>
            </html:div>
          </html:div>
        </tabpanel>

        <!-- 翻译任务 -->
        <tabpanel id="zotwanglele-dashboard-queue" orient="vertical" flex="1">
          <html:div
            id="zotwanglele-queue-root"
            style="
              padding: 12px;
              display: flex;
              flex-direction: column;
              gap: 8px;
              height: 100%;
              box-sizing: border-box;
            "
          >
            <html:div style="display: flex; gap: 8px; align-items: center">
              <html:strong>翻译任务</html:strong>
              <html:span
                id="zotwanglele-queue-summary"
                style="color: #666; flex: 1"
                >暂无任务</html:span
              >
              <html:button id="zotwanglele-queue-clear" type="button"
                >清除已完成</html:button
              >
            </html:div>
            <html:div
              id="zotwanglele-queue-list"
              style="
                flex: 1;
                overflow-y: auto;
                border: 1px solid #ddd;
                border-radius: 4px;
                padding: 8px;
                background: #fafafa;
              "
            >
              <html:p
                data-l10n-id="dashboard-queue-placeholder"
                style="color: #888"
              />
            </html:div>
          </html:div>
        </tabpanel>

        <!-- 提示词管理 -->
        <tabpanel id="zotwanglele-dashboard-prompts" orient="vertical" flex="1">
          <html:div id="zotwanglele-dashboard-prompts-list">
            <html:div class="zwl-prompts-toolbar">
              <html:div>
                <html:h3 data-l10n-id="dashboard-prompts-heading" />
              </html:div>
              <html:button
                id="zwl-prompt-new"
                type="button"
                data-l10n-id="dashboard-prompts-new"
              />
            </html:div>
            <html:div class="zwl-prompts-workspace">
              <html:div
                id="zwl-prompt-list"
                class="zwl-prompt-list"
                role="list"
              ></html:div>
              <html:form id="zwl-prompt-form" class="zwl-prompt-editor">
                <html:div class="zwl-field-row">
                  <html:label
                    for="zwl-prompt-name"
                    data-l10n-id="dashboard-prompts-name"
                  />
                  <html:input
                    id="zwl-prompt-name"
                    type="text"
                    maxlength="80"
                    required="required"
                  />
                </html:div>
                <html:div class="zwl-field-row">
                  <html:label
                    for="zwl-prompt-description"
                    data-l10n-id="dashboard-prompts-description"
                  />
                  <html:input
                    id="zwl-prompt-description"
                    type="text"
                    maxlength="160"
                  />
                </html:div>
                <html:div class="zwl-field-stack">
                  <html:label
                    for="zwl-prompt-system"
                    data-l10n-id="dashboard-prompts-system"
                  />
                  <html:textarea
                    id="zwl-prompt-system"
                    rows="5"
                    required="required"
                  ></html:textarea>
                </html:div>
                <html:div class="zwl-field-stack zwl-field-grow">
                  <html:label
                    for="zwl-prompt-user"
                    data-l10n-id="dashboard-prompts-user"
                  />
                  <html:textarea
                    id="zwl-prompt-user"
                    rows="10"
                    required="required"
                  ></html:textarea>
                </html:div>
                <html:div class="zwl-editor-actions">
                  <html:span
                    id="zwl-prompt-status"
                    aria-live="polite"
                  ></html:span>
                  <html:button
                    id="zwl-prompt-reset"
                    type="button"
                    hidden="hidden"
                    >恢复内置</html:button
                  >
                  <html:button
                    id="zwl-prompt-delete"
                    type="button"
                    data-l10n-id="dashboard-prompts-delete"
                  />
                  <html:button
                    id="zwl-prompt-save"
                    type="submit"
                    data-l10n-id="dashboard-prompts-save"
                  />
                </html:div>
              </html:form>
            </html:div>
          </html:div>
        </tabpanel>

        <!-- 高级设置：翻译配置 -->
        <tabpanel
          id="zotwanglele-dashboard-advanced"
          orient="vertical"
          flex="1"
        >
          <html:div
            id="zotwanglele-adv-root"
            style="
              padding: 12px;
              overflow-y: auto;
              height: 100%;
              box-sizing: border-box;
              font-size: 13px;
            "
          >
            <html:h3 style="margin-top: 0">翻译配置</html:h3>

            <!-- 执行环境与检测 -->
            <html:fieldset style="margin-bottom: 12px; padding: 8px 12px">
              <html:legend>执行环境</html:legend>
              <html:div
                style="
                  display: grid;
                  grid-template-columns: 100px 1fr;
                  gap: 8px 12px;
                  align-items: center;
                "
              >
                <html:label for="zwl-server-url">服务端地址</html:label>
                <html:input
                  type="text"
                  id="zwl-server-url"
                  placeholder="http://127.0.0.1:9999"
                />
                <html:label>环境检测</html:label>
                <html:div style="display: flex; gap: 6px; align-items: center">
                  <html:button type="button" id="zwl-env-check"
                    >立即检测</html:button
                  >
                  <html:span id="zwl-env-status" style="color: #888"
                    >尚未检测</html:span
                  >
                </html:div>
                <html:label>检测详情</html:label>
                <html:div
                  id="zwl-env-detail"
                  style="
                    font-size: 12px;
                    font-family: monospace;
                    color: #444;
                    white-space: pre-wrap;
                  "
                ></html:div>
              </html:div>
            </html:fieldset>
            <!-- 翻译参数 -->
            <html:fieldset style="margin-bottom: 12px; padding: 8px 12px">
              <html:legend>翻译参数</html:legend>
              <html:div
                style="
                  display: grid;
                  grid-template-columns: 100px 1fr;
                  gap: 8px 12px;
                  margin-top: 4px;
                  align-items: center;
                "
              >
                <html:label for="zwl-engine">引擎</html:label>
                <html:select id="zwl-engine">
                  <html:option value="pdf2zh">pdf2zh（稳定）</html:option>
                  <html:option value="pdf2zh_next"
                    >pdf2zh_next（新版，支持 BabelDOC）</html:option
                  >
                </html:select>

                <html:label>输出格式</html:label>
                <html:div style="display: flex; gap: 12px">
                  <html:label
                    style="display: flex; align-items: center; gap: 4px"
                  >
                    <html:input type="checkbox" id="zwl-out-mono" />
                    <html:span>单语（仅译文）</html:span>
                  </html:label>
                  <html:label
                    style="display: flex; align-items: center; gap: 4px"
                  >
                    <html:input type="checkbox" id="zwl-out-dual" />
                    <html:span>双语对照</html:span>
                  </html:label>
                </html:div>

                <html:label for="zwl-dual-mode">双语模式</html:label>
                <html:select id="zwl-dual-mode">
                  <html:option value="LR"
                    >LR：左右分栏（译文左、原文右）</html:option
                  >
                  <html:option value="TB"
                    >TB：交替分页（译文页、原文页）</html:option
                  >
                </html:select>

                <html:label for="zwl-ocr">OCR</html:label>
                <html:label
                  style="display: flex; align-items: center; gap: 4px"
                >
                  <html:input type="checkbox" id="zwl-ocr" />
                  <html:span>扫描版 PDF 或文本层异常时启用</html:span>
                </html:label>

                <html:label for="zwl-lang-out">目标语言</html:label>
                <html:input
                  type="text"
                  id="zwl-lang-out"
                  placeholder="zh / en / ja..."
                />

                <html:label for="zwl-lang-in">源语言</html:label>
                <html:input type="text" id="zwl-lang-in" placeholder="auto" />

                <html:label for="zwl-service">翻译服务（Chat 配置）</html:label>
                <html:select id="zwl-service"></html:select>

                <html:label for="zwl-qps">QPS</html:label>
                <html:input type="number" id="zwl-qps" min="1" max="100" />

                <html:label for="zwl-pool-size">并发池</html:label>
                <html:input
                  type="number"
                  id="zwl-pool-size"
                  min="0"
                  max="1000"
                />
              </html:div>
            </html:fieldset>

            <!-- 保存 -->
            <html:div style="display: flex; gap: 8px; align-items: center">
              <html:button type="button" id="zwl-adv-save"
                ><html:b>保存设置</html:b></html:button
              >
              <html:span
                id="zwl-adv-savestatus"
                style="color: #888"
              ></html:span>
            </html:div>
          </html:div>
        </tabpanel>
      </tabpanels>
    </tabbox>

    <!-- 底部操作栏 -->
    <hbox align="center" pack="end" style="padding-top: 8px">
      <button data-l10n-id="dashboard-close" oncommand="window.close()" />
    </hbox>
  </vbox>
</window>
