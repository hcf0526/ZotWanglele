<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/dashboard.css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="ZotWanglele 仪表盘"
  windowtype="zotwanglele:dashboard"
  width="980"
  height="720"
  persist="screenX screenY width height"
  onload="window.opener.Zotero.__addonInstance__.hooks.onDashboardLoad(window)"
  onunload="
    window.opener.Zotero.__addonInstance__.hooks.onDashboardUnload(window)
  "
>
  <linkset>
    <html:link rel="localization" href="__addonRef__-dashboard.ftl" />
  </linkset>

  <vbox flex="1" class="zwl-dashboard-shell">
    <!-- 顶部标题栏 -->
    <hbox align="center" class="zwl-dashboard-titlebar">
      <html:img
        class="zwl-dashboard-brand-mark"
        src="chrome://zotwanglele/content/icons/icon@32.png"
        alt=""
      />
      <html:h2 data-l10n-id="dashboard-title" />
    </hbox>

    <!-- Tab 容器 -->
    <tabbox flex="1" class="zwl-dashboard-tabbox">
      <tabs class="zwl-dashboard-tabs">
        <tab
          class="zwl-dashboard-tab zwl-dashboard-tab-overview"
          data-l10n-id="dashboard-tab-overview"
        />
        <tab
          class="zwl-dashboard-tab zwl-dashboard-tab-queue"
          data-l10n-id="dashboard-tab-queue"
        />
        <tab
          class="zwl-dashboard-tab zwl-dashboard-tab-prompts"
          data-l10n-id="dashboard-tab-prompts"
        />
        <tab
          class="zwl-dashboard-tab zwl-dashboard-tab-advanced"
          data-l10n-id="dashboard-tab-advanced"
        />
      </tabs>
      <tabpanels flex="1">
        <!-- 概览 -->
        <tabpanel
          id="zotwanglele-dashboard-overview"
          class="zwl-dashboard-panel"
          orient="vertical"
          flex="1"
        >
          <html:div id="zotwanglele-overview-root" class="zwl-overview">
            <html:div class="zwl-overview-hero">
              <html:div class="zwl-overview-hero-copy">
                <html:span
                  class="zwl-overview-kicker"
                  data-l10n-id="dashboard-overview-kicker"
                />
                <html:h3 data-l10n-id="dashboard-overview-heading" />
              </html:div>
              <html:div class="zwl-overview-hero-visual" aria-hidden="true">
                <html:img
                  class="zwl-overview-hero-flow"
                  src="chrome://zotwanglele/content/icons/dashboard/research-flow.svg"
                  alt=""
                />
                <html:img
                  class="zwl-overview-hero-mark"
                  src="chrome://zotwanglele/content/icons/icon@64.png"
                  alt=""
                />
              </html:div>
            </html:div>
            <html:div class="zwl-metrics">
              <html:div class="zwl-metric">
                <html:span class="zwl-metric-icon" aria-hidden="true">
                  <html:img
                    class="zwl-dashboard-icon"
                    src="chrome://zotwanglele/content/icons/dashboard/model.svg"
                    alt=""
                  />
                </html:span>
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-profile"
                />
                <html:strong
                  id="zwl-overview-profile"
                  class="zwl-metric-profile-value"
                  >尚未选择</html:strong
                >
                <html:small
                  id="zwl-overview-model"
                  class="zwl-metric-profile-value"
                ></html:small>
              </html:div>
              <html:div class="zwl-metric">
                <html:span class="zwl-metric-icon" aria-hidden="true">
                  <html:img
                    class="zwl-dashboard-icon"
                    src="chrome://zotwanglele/content/icons/dashboard/sparkles.svg"
                    alt=""
                  />
                </html:span>
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-prompts"
                />
                <html:strong id="zwl-overview-prompts">0</html:strong>
                <html:small id="zwl-overview-custom-prompts"></html:small>
              </html:div>
              <html:div class="zwl-metric">
                <html:span class="zwl-metric-icon" aria-hidden="true">
                  <html:img
                    class="zwl-dashboard-icon"
                    src="chrome://zotwanglele/content/icons/dashboard/progress.svg"
                    alt=""
                  />
                </html:span>
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-tasks"
                />
                <html:strong id="zwl-overview-tasks">0</html:strong>
                <html:small id="zwl-overview-task-total"></html:small>
              </html:div>
              <html:div class="zwl-metric">
                <html:span class="zwl-metric-icon" aria-hidden="true">
                  <html:img
                    class="zwl-dashboard-icon"
                    src="chrome://zotwanglele/content/icons/dashboard/languages.svg"
                    alt=""
                  />
                </html:span>
                <html:span
                  class="zwl-metric-label"
                  data-l10n-id="dashboard-overview-titles"
                />
                <html:strong id="zwl-overview-titles">0/0</html:strong>
                <html:small id="zwl-overview-title-caption"></html:small>
              </html:div>
            </html:div>
          </html:div>
        </tabpanel>

        <!-- 任务记录 -->
        <tabpanel
          id="zotwanglele-dashboard-queue"
          class="zwl-dashboard-panel"
          orient="vertical"
          flex="1"
        >
          <html:section id="zotwanglele-queue-root" class="zwl-task-records">
            <html:header class="zwl-task-records-header">
              <html:div class="zwl-task-records-heading">
                <html:span class="zwl-task-records-icon" aria-hidden="true">
                  <html:img
                    class="zwl-dashboard-icon"
                    src="chrome://zotwanglele/content/icons/dashboard/task-list.svg"
                    alt=""
                  />
                </html:span>
                <html:div>
                  <html:h3 data-l10n-id="dashboard-task-records-heading" />
                  <html:p
                    id="zotwanglele-queue-summary"
                    class="zwl-task-records-summary"
                    >暂无任务记录</html:p
                  >
                </html:div>
              </html:div>
              <html:button
                id="zotwanglele-queue-clear"
                class="zwl-task-clear-button"
                type="button"
                data-l10n-id="dashboard-task-records-clear"
              />
            </html:header>
            <html:div
              id="zotwanglele-queue-list"
              class="zwl-task-records-list"
              role="list"
            >
              <html:p data-l10n-id="dashboard-queue-placeholder" />
            </html:div>
          </html:section>
        </tabpanel>

        <!-- 提示词管理 -->
        <tabpanel
          id="zotwanglele-dashboard-prompts"
          class="zwl-dashboard-panel"
          orient="vertical"
          flex="1"
        >
          <html:div id="zotwanglele-dashboard-prompts-list">
            <html:div class="zwl-prompts-toolbar">
              <html:div>
                <html:h3 data-l10n-id="dashboard-prompts-heading" />
              </html:div>
              <html:button
                id="zwl-prompt-new"
                type="button"
                data-l10n-id="dashboard-prompts-new"
              />
            </html:div>
            <html:div class="zwl-prompts-workspace">
              <html:div
                id="zwl-prompt-list"
                class="zwl-prompt-list"
                role="list"
              ></html:div>
              <html:form id="zwl-prompt-form" class="zwl-prompt-editor">
                <html:div class="zwl-field-row">
                  <html:label data-l10n-id="dashboard-prompts-name" />
                  <html:div
                    id="zwl-prompt-name-view"
                    class="zwl-prompt-static-value zwl-prompt-name-view"
                  ></html:div>
                </html:div>
                <html:div class="zwl-field-row">
                  <html:label data-l10n-id="dashboard-prompts-description" />
                  <html:div
                    id="zwl-prompt-description-view"
                    class="zwl-prompt-static-value zwl-prompt-description-view"
                  ></html:div>
                </html:div>
                <html:div class="zwl-field-stack zwl-field-header">
                  <html:div class="zwl-field-label-row">
                    <html:label
                      for="zwl-prompt-system"
                      data-l10n-id="dashboard-prompts-system"
                    />
                    <html:span
                      class="zwl-editor-actions zwl-editor-actions-top"
                    >
                      <html:button
                        id="zwl-prompt-reset-top"
                        type="button"
                        hidden="hidden"
                        data-l10n-id="dashboard-prompts-reset"
                      />
                      <html:button
                        id="zwl-prompt-save-top"
                        type="submit"
                        data-l10n-id="dashboard-prompts-save"
                      />
                    </html:span>
                  </html:div>
                  <html:textarea
                    id="zwl-prompt-system"
                    rows="5"
                    required="required"
                  ></html:textarea>
                </html:div>
                <html:div class="zwl-field-stack zwl-field-grow">
                  <html:label
                    for="zwl-prompt-user"
                    data-l10n-id="dashboard-prompts-user"
                  />
                  <html:textarea
                    id="zwl-prompt-user"
                    rows="10"
                    required="required"
                  ></html:textarea>
                </html:div>
                <html:div class="zwl-editor-actions">
                  <html:span
                    id="zwl-prompt-status"
                    aria-live="polite"
                  ></html:span>
                  <html:button
                    id="zwl-prompt-reset"
                    type="button"
                    hidden="hidden"
                    data-l10n-id="dashboard-prompts-reset"
                  />
                  <html:button
                    id="zwl-prompt-delete"
                    type="button"
                    data-l10n-id="dashboard-prompts-delete"
                  />
                  <html:button
                    id="zwl-prompt-save"
                    type="submit"
                    data-l10n-id="dashboard-prompts-save"
                  />
                </html:div>
              </html:form>
            </html:div>
          </html:div>
        </tabpanel>

        <!-- 高级设置：翻译配置 -->
        <tabpanel
          id="zotwanglele-dashboard-advanced"
          class="zwl-dashboard-panel"
          orient="vertical"
          flex="1"
        >
          <html:div id="zotwanglele-adv-root" class="zwl-advanced-root">
            <html:h3 class="zwl-advanced-heading">翻译设置</html:h3>

            <!-- 执行环境与检测 -->
            <html:fieldset class="zwl-settings-section">
              <html:legend class="zwl-settings-legend">执行环境</html:legend>
              <html:div class="zwl-settings-grid">
                <html:label class="zwl-settings-label" for="zwl-server-url"
                  >服务端地址</html:label
                >
                <html:input
                  type="text"
                  id="zwl-server-url"
                  placeholder="http://127.0.0.1:9999"
                />
                <html:label class="zwl-settings-label">环境检测</html:label>
                <html:div class="zwl-settings-inline">
                  <html:button type="button" id="zwl-env-check"
                    >立即检测</html:button
                  >
                  <html:span id="zwl-env-status" class="zwl-settings-status"
                    >尚未检测</html:span
                  >
                </html:div>
                <html:label class="zwl-settings-label">检测详情</html:label>
                <html:div
                  id="zwl-env-detail"
                  class="zwl-settings-detail"
                ></html:div>
              </html:div>
            </html:fieldset>
            <!-- 翻译参数 -->
            <html:fieldset class="zwl-settings-section">
              <html:legend class="zwl-settings-legend">翻译参数</html:legend>
              <html:div class="zwl-settings-grid">
                <html:label class="zwl-settings-label" for="zwl-engine"
                  >引擎</html:label
                >
                <html:select id="zwl-engine">
                  <html:option value="pdf2zh">pdf2zh</html:option>
                  <html:option value="pdf2zh_next">pdf2zh_next</html:option>
                </html:select>

                <html:label class="zwl-settings-label">输出格式</html:label>
                <html:div class="zwl-settings-inline zwl-settings-options">
                  <html:label class="zwl-settings-check">
                    <html:input
                      type="radio"
                      name="zwl-out-format"
                      id="zwl-out-mono"
                    />
                    <html:span>单语</html:span>
                  </html:label>
                  <html:label class="zwl-settings-check">
                    <html:input
                      type="radio"
                      name="zwl-out-format"
                      id="zwl-out-dual"
                    />
                    <html:span>双语</html:span>
                  </html:label>
                </html:div>

                <html:label class="zwl-settings-label" for="zwl-dual-mode"
                  >双语模式</html:label
                >
                <html:select id="zwl-dual-mode">
                  <html:option value="LR">LR</html:option>
                  <html:option value="TB">TB</html:option>
                </html:select>

                <html:label
                  class="zwl-settings-label zwl-settings-label-ocr"
                  for="zwl-ocr"
                  >OCR</html:label
                >
                <html:div class="zwl-settings-inline">
                  <html:input type="checkbox" id="zwl-ocr" />
                </html:div>

                <html:label class="zwl-settings-label" for="zwl-lang-out"
                  >目标语言</html:label
                >
                <html:input
                  type="text"
                  id="zwl-lang-out"
                  placeholder="zh / en / ja..."
                />

                <html:label class="zwl-settings-label" for="zwl-lang-in"
                  >源语言</html:label
                >
                <html:input type="text" id="zwl-lang-in" placeholder="auto" />

                <html:label class="zwl-settings-label" for="zwl-service"
                  >翻译服务</html:label
                >
                <html:select id="zwl-service"></html:select>

                <html:label class="zwl-settings-label" for="zwl-qps"
                  >QPS</html:label
                >
                <html:input type="number" id="zwl-qps" min="1" max="100" />

                <html:label class="zwl-settings-label" for="zwl-pool-size"
                  >并发池</html:label
                >
                <html:input
                  type="number"
                  id="zwl-pool-size"
                  min="0"
                  max="1000"
                />
              </html:div>
            </html:fieldset>

            <html:div class="zwl-advanced-actions">
              <html:button type="button" id="zwl-adv-save"
                >✓ <html:b>保存设置</html:b></html:button
              >
              <html:span
                id="zwl-adv-savestatus"
                class="zwl-settings-status"
              ></html:span>
            </html:div>
          </html:div>
        </tabpanel>
      </tabpanels>
    </tabbox>

    <!-- 底部操作栏 -->
    <hbox align="center" pack="end" class="zwl-dashboard-footer">
      <button data-l10n-id="dashboard-close" oncommand="window.close()" />
    </hbox>
  </vbox>
</window>
