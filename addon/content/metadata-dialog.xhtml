<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/paper-theme.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/metadata-dialog.css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="更新文献信息"
  windowtype="zotwanglele:metadata-dialog"
  width="920"
  height="640"
  persist="screenX screenY width height"
  onload="
    window.opener.Zotero.__addonInstance__.hooks.onMetadataDialogLoad(window)
  "
  ondialogcancel="window.zwlMetadataCancel()"
>
  <vbox flex="1" class="zwl-dialog-root">
    <html:div class="zwl-metadata-shell">
      <html:header class="zwl-dialog-header">
        <html:img
          class="zwl-dialog-brand-mark"
          src="chrome://zotwanglele/content/icons/icon@32.png"
          alt=""
        />
        <html:div class="zwl-dialog-heading-copy">
          <html:h1 id="zwl-metadata-title" class="zwl-metadata-heading">
            更新文献信息
          </html:h1>
          <html:p class="zwl-metadata-note">
            勾选需要写入 Zotero 的字段。当前值会保留到你确认应用为止。
          </html:p>
        </html:div>
      </html:header>

      <html:div class="zwl-metadata-header">
        <html:div>字段</html:div>
        <html:div>当前值</html:div>
        <html:div>Crossref</html:div>
        <html:div>接受</html:div>
      </html:div>
      <html:div id="zwl-metadata-diffs" class="zwl-metadata-table">
        <html:p
          id="zwl-metadata-empty"
          class="zwl-metadata-empty"
          hidden="true"
        >
          没有检测到字段差异
        </html:p>
      </html:div>

      <html:div class="zwl-metadata-toolbar">
        <button
          class="zwl-dialog-button"
          label="全选"
          oncommand="window.zwlMetadataSelectAll(true)"
        />
        <button
          class="zwl-dialog-button"
          label="取消全选"
          oncommand="window.zwlMetadataSelectAll(false)"
        />
        <html:div class="zwl-metadata-spacer" />
        <button
          class="zwl-dialog-button"
          label="取消"
          oncommand="window.zwlMetadataCancel()"
        />
        <button
          class="zwl-dialog-button zwl-dialog-button-primary"
          label="应用所选"
          default="true"
          oncommand="window.zwlMetadataApply()"
        />
      </html:div>
    </html:div>
  </vbox>
</window>
