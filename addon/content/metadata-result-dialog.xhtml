<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/paper-theme.css"?> <?xml-stylesheet
href="chrome://zotwanglele/content/metadata-dialog.css"?>
<window
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  title="ZotWanglele 元数据更新结果"
  windowtype="zotwanglele:metadata-result-dialog"
  width="860"
  height="640"
  persist="screenX screenY width height"
  onload="
    window.opener.Zotero.__addonInstance__.hooks.onMetadataResultDialogLoad(
      window,
    )
  "
  ondialogcancel="window.zwlMetadataResultClose()"
>
  <vbox flex="1" class="zwl-dialog-root">
    <html:div class="zwl-metadata-result-shell">
      <html:header class="zwl-dialog-header">
        <html:img
          class="zwl-dialog-brand-mark"
          src="chrome://zotwanglele/content/icons/icon@32.png"
          alt=""
        />
        <html:div class="zwl-dialog-heading-copy">
          <html:h1 class="zwl-metadata-result-heading">
            元数据更新结果
          </html:h1>
          <html:p class="zwl-metadata-result-note">
            以下为每个条目的处理结果，如有错误可根据提示修正后重试。
          </html:p>
        </html:div>
      </html:header>

      <html:div id="zwl-metadata-result-list" class="zwl-metadata-result-list">
        <html:p
          id="zwl-metadata-result-empty"
          class="zwl-metadata-result-empty"
          hidden="true"
        >
          没有条目需要处理
        </html:p>
      </html:div>

      <html:div class="zwl-metadata-result-toolbar">
        <button
          class="zwl-dialog-button zwl-dialog-button-brand"
          label="关闭"
          default="true"
          oncommand="window.zwlMetadataResultClose()"
        />
      </html:div>
    </html:div>
  </vbox>
</window>
