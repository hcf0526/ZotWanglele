<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- 左翼渐变 (蓝青) -->
    <linearGradient id="leftWingC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- 右翼渐变 (紫粉) -->
    <linearGradient id="rightWingC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- 边框 -->
    <linearGradient id="borderGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="128" height="128" rx="28" fill="url(#bgGradC)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="url(#borderGradC)" stroke-width="1.5"/>

  <!-- 主体结构：双重对称几何折角与交叠 -->
  <g filter="url(#shadowC)">
    <!-- 左半 V -->
    <path d="M 28 38 C 28 34 32 32 35 34 L 49 84 C 50 87 53 87 54 84 L 64 52"
          fill="none"
          stroke="url(#leftWingC)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 右半 V -->
    <path d="M 64 52 L 74 84 C 75 87 78 87 79 84 L 93 34 C 96 32 100 34 100 38"
          fill="none"
          stroke="url(#rightWingC)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 中间交汇处高光小星芒 -->
    <polygon points="64,44 66.5,49.5 72,52 66.5,54.5 64,60 61.5,54.5 56,52 61.5,49.5" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>